[project]
name = "banglatok"
version = "0.2.2"
description = "Fast, lossless subword tokenizers for Bangla, English and Banglish (romanized Bengali), including code-mixed text."
readme = "README.md"
authors = [
    { name = "Aber Islam", email = "aber.islam.dev@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []
license = "MIT AND BSD-3-Clause AND CC-BY-SA-4.0"
license-files = [
    "LICENSE",
    "MODEL_LICENSE.md",
    "THIRD_PARTY_NOTICES.md",
    "third_party/licenses/*",
]
keywords = [
    "bengali",
    "bangla",
    "banglish",
    "romanized-bengali",
    "code-mixed",
    "tokenizer",
    "subword",
    "bpe",
    "unigram",
    "nlp",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Bengali",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Go",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/iamaber/banglatok"
Repository = "https://github.com/iamaber/banglatok"
Documentation = "https://github.com/iamaber/banglatok/blob/main/docs/USAGE.md"
Issues = "https://github.com/iamaber/banglatok/issues"
Changelog = "https://github.com/iamaber/banglatok/blob/main/CHANGELOG.md"
Dataset = "https://huggingface.co/datasets/iamaber/banglatok-training-corpus"

[project.scripts]
banglatok = "banglatok.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["banglatok*"]

[tool.setuptools.package-data]
banglatok = ["py.typed", "data/*.json", "pretrained/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.cibuildwheel]
build = "cp311-*"
skip = "*-musllinux_*"
test-command = "python -m unittest discover -s {project}/tests -v"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
