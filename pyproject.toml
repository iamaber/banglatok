[project]
name = "bn-tokenizers-embedding"
version = "0.1.0a1"
description = "Bangla, English and Banglish tokenizers with a native Go engine"
readme = "README.md"
authors = [
    { name = "Aber Islam", email = "aber.islam.dev@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/*"]
keywords = ["bengali", "bangla", "banglish", "tokenizer", "unigram", "bpe", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Go",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/iamaber/bn-tokenizers-embedding"
Documentation = "https://github.com/iamaber/bn-tokenizers-embedding#readme"
Issues = "https://github.com/iamaber/bn-tokenizers-embedding/issues"
Changelog = "https://github.com/iamaber/bn-tokenizers-embedding/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bn_tokenizers_embedding*"]

[tool.setuptools.package-data]
bn_tokenizers_embedding = ["py.typed", "data/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.cibuildwheel]
build = "cp311-*"
test-command = "python -m unittest discover -s {project}/tests -v"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
