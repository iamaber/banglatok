name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: test -z "$(gofmt -l tokenizer internal/native cmd corpus)"
      - run: go test -race ./...
      - run: go vet ./...

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: macos-15
            python: '3.10'
          - os: macos-15
            python: '3.15'
          - os: ubuntu-24.04-arm
            python: '3.12'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.15'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MinGW-w64 GCC for cgo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gcc
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - name: Build wheel from source distribution
        run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - name: Validate release archives
        run: |
          python -m twine check --strict dist/*
          python tools/check_dist.py dist --version "$(python -c 'from importlib.metadata import version; print(version("banglatok"))')"
      - name: Python style, types and Hugging Face export dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install ruff mypy tokenizers
          ruff check src tests research/tests tools examples setup.py benchmarks
          ruff format --check src tests research/tests tools benchmarks
          mypy --strict src/banglatok
      - name: Installed tokenizer tests
        run: python -m unittest discover -s tests -v
      - name: Research tooling tests from checkout
        run: python -m unittest discover -s research/tests -v
      - run: python examples/quickstart.py
