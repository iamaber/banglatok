name: Build and optionally publish release

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tokenizer/**'
      - 'internal/native/**'
      - 'cmd/bntok-shared/**'
      - 'tests/**'
      - 'tools/**'
      - 'third_party/**'
      - 'go.*'
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - README.md
      - MODEL_LICENSE.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated artifacts to PyPI (requires matching version tag and protected pypi environment)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: version
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['PUBLISH'] == 'true':
              if not os.environ['RELEASE_REF'].startswith('refs/tags/') or os.environ['RELEASE_TAG'] != 'v' + version:
                  raise SystemExit('Publish only from the exact v<project-version> tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install MinGW-w64 GCC for cgo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gcc
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: dist
      - name: Expose verified host Go toolchain inside manylinux
        if: runner.os == 'Linux'
        run: |
          echo "CIBW_ENVIRONMENT_LINUX=GOROOT=/host$(go env GOROOT) BNTOK_GO=/host$(go env GOROOT)/bin/go GOCACHE=/tmp/go-build GOMODCACHE=/tmp/go-mod CGO_ENABLED=1" >> "$GITHUB_ENV"
      - run: python -m pip install cibuildwheel==4.3.5
      - name: Build and test repaired wheels from the sdist
        shell: bash
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          PYTHONUTF8: '1'
        run: python -m cibuildwheel dist/*.tar.gz --platform ${{ matrix.platform }} --output-dir wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  installed-wheel:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse
      - run: python -m pip install --no-deps wheelhouse/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python examples/quickstart.py

  validate:
    needs: [source, wheels, installed-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: dist
      - run: python -m pip install twine
      - run: python -m twine check --strict dist/*
      - env:
          PROJECT_VERSION: ${{ needs.source.outputs.version }}
        run: python tools/check_dist.py dist --version "$PROJECT_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bn-tokenizers-embedding/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
